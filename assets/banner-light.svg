<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">HawkForge</title>
  <desc id="d">Fixing real bugs in the tools developers rely on.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/><stop offset="0.55" stop-color="#F97316"/><stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F97316" stop-opacity="0.18"/><stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0F172A" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .spark { animation: rise 3.2s ease-out infinite; opacity: 0; }
    .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; } .s4 { animation-delay: 2.4s; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .add { animation: grow 4s ease-in-out infinite; transform-origin: 0 0; transform-box: fill-box; }
    .pass { animation: pop 4s ease-in-out infinite; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-70px); opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes grow { 0%, 15% { transform: scaleX(0); } 35%, 100% { transform: scaleX(1); } }
    @keyframes pop { 0%, 40% { opacity: 0; } 55%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .spark, .cursor, .add, .pass { animation: none; opacity: 1; transform: none; } .spark { opacity: 0; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <circle cx="150" cy="170" r="190" fill="url(#glow)"/>

    <!-- mark: hawk head in a hexagon -->
    <g transform="translate(78 98)">
      <path d="M72 0 L134 36 V108 L72 144 L10 108 V36 Z" fill="none" stroke="url(#ember)" stroke-width="5" stroke-linejoin="round"/>
      <path d="M40 124 C34 100 32 70 50 52 C60 42 74 38 88 40 L102 44 C112 46 120 54 122 66 L123 80 L113 70 C109 68 104 68 100 68 C92 72 86 80 84 92 C82 104 82 114 84 124 Z" fill="url(#ember)"/>
      <path d="M70 51 L102 45 L99 52 Z" fill="#FFFFFF"/>
      <circle cx="88" cy="58" r="4.5" fill="#FFFFFF"/>
      <path d="M101 63 Q109 61 117 66" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M44 98 L60 90 M43 110 L59 103" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55"/>
      <circle class="spark" cx="40" cy="150" r="3" fill="#FBBF24"/>
      <circle class="spark s2" cx="96" cy="150" r="2.5" fill="#F97316"/>
      <circle class="spark s3" cx="66" cy="150" r="2" fill="#FBBF24"/>
      <circle class="spark s4" cx="120" cy="150" r="2.5" fill="#F97316"/>
    </g>

    <text class="sans" x="262" y="150" font-size="76" font-weight="800" letter-spacing="-2" fill="#0F172A">HawkForge</text>
    <text class="sans" x="266" y="194" font-size="25" fill="#475569">Fixing real bugs in the tools developers rely on.</text>
    <text class="mono" x="266" y="244" font-size="18" fill="#334155"><tspan fill="#F97316">$</tspan> git commit -m "fix: the root cause, with a test"<tspan class="cursor" fill="#F97316"> &#9612;</tspan></text>

    <!-- diff card -->
    <g transform="translate(900 62)">
      <rect width="316" height="196" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <circle cx="22" cy="22" r="5" fill="#F87171"/><circle cx="40" cy="22" r="5" fill="#FBBF24"/><circle cx="58" cy="22" r="5" fill="#4ADE80"/>
      <rect x="18" y="46" width="200" height="10" rx="5" fill="#E2E8F0"/>
      <rect x="10" y="66" width="296" height="24" rx="6" fill="#FEE2E2"/>
      <text class="mono" x="18" y="83" font-size="15" font-weight="700" fill="#DC2626">&#8722;</text>
      <rect x="38" y="73" width="170" height="10" rx="5" fill="#DC2626" fill-opacity="0.55"/>
      <rect x="10" y="94" width="296" height="24" rx="6" fill="#DCFCE7"/>
      <text class="mono" x="18" y="111" font-size="15" font-weight="700" fill="#16A34A">+</text>
      <rect class="add" x="38" y="101" width="210" height="10" rx="5" fill="#16A34A" fill-opacity="0.6"/>
      <rect x="18" y="130" width="150" height="10" rx="5" fill="#E2E8F0"/>
      <g class="pass">
        <rect x="18" y="154" width="128" height="26" rx="13" fill="#DCFCE7"/>
        <path d="M32 167 l5 5 l9 -10" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="sans" x="54" y="172" font-size="14" font-weight="600" fill="#16A34A">tests pass</text>
      </g>
    </g>
  </g>
</svg>
